[project]
name = "vaos"
version = "0.1.0"
description = "VPTI AI Operating System — turns regulation and knowledge into grounded, structured, actionable output"
requires-python = ">=3.12"
# Base deps: all have wheels on current Python. Heavy native/ML deps live in the
# optional [rag]/[eval] groups (no py3.14 wheels yet — install them on py3.12).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-telegram-bot",      # Telegram interface (long-polling for MVP, ADR-0003 / vaos-mvp/01)
    "httpx",                    # pasal-id, Tavily, Linear, Azure calls
    "loguru",                   # logging (Feedback Loop, vaos-mvp/09)
    "sqlalchemy",
    "psycopg[binary]",          # PostgreSQL durable store
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
# RAG runtime — internal Vault index + local embeddings (ADR-0002/0006/0007).
# Needs a py3.12 env (faiss/torch have no py3.14 wheels yet).
rag = [
    "faiss-cpu",
    "numpy",                    # vector math for the FAISS vault (vaos-mvp/04)
    "sentence-transformers",    # local multilingual-e5
]
# AI evaluation. Also needs py3.12 (ragas -> scikit-network has no py3.14 wheel).
eval = [
    "ragas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vaos"]

[[tool.mypy.overrides]]
module = ["faiss.*"]
ignore_missing_imports = true
