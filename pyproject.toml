[project]
name = "vaos"
version = "0.1.0"
description = "VPTI AI Operating System — turns regulation and knowledge into grounded, structured, actionable output"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-telegram-bot",      # Telegram interface (long-polling for MVP, ADR-0003 / vaos-mvp/01)
    "httpx",                    # pasal-id, Tavily, Linear, Azure calls
    "faiss-cpu",                # internal Vault index (ADR-0002 / ADR-0006)
    "sentence-transformers",    # local multilingual-e5 embeddings (ADR-0007)
    "loguru",                   # logging (Feedback Loop, vaos-mvp/09)
    "sqlalchemy",
    "psycopg[binary]",          # PostgreSQL durable store
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "ragas",                    # AI eval: groundedness / relevance / correctness
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vaos"]
